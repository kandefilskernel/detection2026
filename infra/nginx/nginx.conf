# Point d'entrée unique (remplace l'ancienne passerelle Python).
#   /             tableau de bord (Next.js, qui relaie /api vers le backoffice)
#   /ingest/...   API des opérateurs -> integration-layer (limitation de débit par IP)
worker_processes auto;
events { worker_connections 4096; }

http {
    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64k;

    log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # 200 requêtes/s par opérateur (IP), rafale de 400 : protège le scoring
    limit_req_zone $binary_remote_addr zone=operators:10m rate=200r/s;
    limit_req_status 429;

    # Résolution DNS Docker à CHAQUE requête (cache de 5 s) : un conteneur recréé (reconstruction, redémarrage) change
    # d'adresse IP ; avec un bloc `upstream`, Nginx garderait l'ancienne et renverrait « 502 Bad Gateway » jusqu'à son
    # propre redémarrage.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location /ingest/ {
            limit_req zone=operators burst=400 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 2s;
            set $integration http://integration-layer:8002;
            rewrite ^/ingest/(.*)$ /$1 break;
            proxy_pass $integration$uri$is_args$args;
        }

        # API partenaires (institutions) : scoring, retours, statistiques, supervision ; documentation sur /v1/docs
        location /v1/ {
            limit_req zone=operators burst=400 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
            set $integration http://integration-layer:8002;
            proxy_pass $integration$request_uri;
        }

        location = /healthz { return 200 "ok\n"; }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            set $dashboard http://frontend:3000;
            proxy_pass $dashboard;
        }
    }
}
